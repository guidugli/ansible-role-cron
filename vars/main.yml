---
# Internal OS-specific mappings.

_cron_packages:
  default:
    - cronie
  Alpine:
    - dcron
  Debian:
    - cron
  Ubuntu:
    - cron
  Ubuntu-18:
    - cron

cron_packages: >-
  {{
    _cron_packages.get(
      ansible_facts['distribution'] ~ '-' ~ ansible_facts['distribution_major_version'],
      _cron_packages.get(
        ansible_facts['distribution'],
        _cron_packages['default']
      )
    )
  }}

_cron_configuration:
  default: /etc/crontab
  Archlinux: /etc/conf.d/crond

cron_configuration: >-
  {{
    _cron_configuration.get(
      ansible_facts['distribution'] ~ '-' ~ ansible_facts['distribution_major_version'],
      _cron_configuration.get(
        ansible_facts['distribution'],
        _cron_configuration['default']
      )
    )
  }}

_cron_service:
  default: crond
  Alpine: ''
  Archlinux: cronie
  Debian: cron
  Suse: cron
  Ubuntu: cron

cron_service: >-
  {{
    _cron_service.get(
      ansible_facts['distribution'] ~ '-' ~ ansible_facts['distribution_major_version'],
      _cron_service.get(
        ansible_facts['distribution'],
        _cron_service['default']
      )
    )
  }}
