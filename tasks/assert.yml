---
- name: Validate cron_shell
  ansible.builtin.assert:
    that:
      - cron_shell | string | trim | length > 0
    fail_msg: cron_shell must be a non-empty string.
    quiet: true
  tags:
    - cron
    - validate

- name: Validate cron_path
  ansible.builtin.assert:
    that:
      - cron_path | string | trim | length > 0
    fail_msg: cron_path must be a non-empty string.
    quiet: true
  tags:
    - cron
    - validate

- name: Validate cron_mailto
  ansible.builtin.assert:
    that:
      - cron_mailto | string | trim | length > 0
    fail_msg: cron_mailto must be a non-empty string.
    quiet: true
  tags:
    - cron
    - validate

- name: Validate cron_allowed_users container type
  ansible.builtin.assert:
    that:
      - cron_allowed_users is sequence
      - cron_allowed_users is not string
    fail_msg: cron_allowed_users must be a list of usernames.
    quiet: true
  tags:
    - cron
    - validate

- name: Validate cron_allowed_users entries
  ansible.builtin.assert:
    that:
      - item | string | trim | length > 0
    fail_msg: Each entry in cron_allowed_users must be a non-empty string.
    quiet: true
  loop: "{{ cron_allowed_users }}"
  loop_control:
    label: "{{ item }}"
  tags:
    - cron
    - validate

- name: Validate cron_allowed_users uniqueness
  ansible.builtin.assert:
    that:
      - cron_allowed_users | unique | length == cron_allowed_users | length
    fail_msg: cron_allowed_users must not contain duplicate usernames.
    quiet: true
  tags:
    - cron
    - validate

- name: Validate cron_jobs container type
  ansible.builtin.assert:
    that:
      - cron_jobs is sequence
      - cron_jobs is not string
    fail_msg: cron_jobs must be a list of cron job definitions.
    quiet: true
  tags:
    - cron
    - validate

- name: Validate cron_jobs entries
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.name | default('') | string | trim | length > 0
      - item.state | default('present') in ['present', 'absent']
      - >-
        (item.state | default('present')) == 'absent' or
        (item.job | default('') | string | trim | length > 0)
      - item.user is not defined or (item.user | string | trim | length > 0)
      - item.minute is not defined or (item.minute | string | trim | length > 0)
      - item.hour is not defined or (item.hour | string | trim | length > 0)
      - item.day is not defined or (item.day | string | trim | length > 0)
      - item.month is not defined or (item.month | string | trim | length > 0)
      - item.weekday is not defined or (item.weekday | string | trim | length > 0)
    fail_msg: >-
      Each cron_jobs item must be a mapping with a non-empty name, a valid state,
      and a non-empty job when state=present.
    quiet: true
  loop: "{{ cron_jobs }}"
  loop_control:
    label: "{{ item.name | default('unnamed') }}"
  tags:
    - cron
    - validate
