---
- name: Run semantic validation
  ansible.builtin.import_tasks: assert.yml
  tags:
    - cron
    - validate

- name: Inspect apt package indexes on Debian family hosts
  ansible.builtin.find:
    paths: /var/lib/apt/lists
    patterns: '*_Packages*'
    file_type: file
  register: cron_apt_package_indexes
  changed_when: false
  when: ansible_facts['os_family'] == 'Debian'
  tags:
    - cron
    - install

- name: Update apt cache on Debian family hosts
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: >-
      {{
        3600 if (cron_apt_package_indexes.matched | default(0) | int) > 0
        else 0
      }}
  when: ansible_facts['os_family'] == 'Debian'
  tags:
    - cron
    - install

- name: Install cron packages
  ansible.builtin.package:
    name: "{{ cron_packages }}"
    state: present
  tags:
    - cron
    - install

- name: Configure cron SHELL
  ansible.builtin.lineinfile:
    path: "{{ cron_configuration }}"
    regexp: '^SHELL='
    line: "SHELL={{ cron_shell }}"
    create: true
    owner: root
    group: root
    mode: '0600'
  notify: Restart cron
  tags:
    - cron
    - config

- name: Configure cron PATH
  ansible.builtin.lineinfile:
    path: "{{ cron_configuration }}"
    regexp: '^PATH='
    line: "PATH={{ cron_path }}"
    create: true
    owner: root
    group: root
    mode: '0600'
  notify: Restart cron
  tags:
    - cron
    - config

- name: Configure cron MAILTO
  ansible.builtin.lineinfile:
    path: "{{ cron_configuration }}"
    regexp: '^MAILTO='
    line: "MAILTO={{ cron_mailto }}"
    create: true
    owner: root
    group: root
    mode: '0600'
  notify: Restart cron
  tags:
    - cron
    - config

- name: Ensure cron directories exist with secure permissions
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: /etc/cron.hourly
      mode: '0700'
    - path: /etc/cron.daily
      mode: '0700'
    - path: /etc/cron.weekly
      mode: '0700'
    - path: /etc/cron.monthly
      mode: '0700'
    - path: /etc/cron.d
      mode: '0700'
  loop_control:
    label: "{{ item.path }}"
  tags:
    - cron
    - config

- name: Ensure cron.deny is absent
  ansible.builtin.file:
    path: /etc/cron.deny
    state: absent
  tags:
    - cron
    - config

- name: Ensure cron.allow exists
  ansible.builtin.file:
    path: /etc/cron.allow
    state: touch
    owner: root
    group: root
    mode: '0640'
    modification_time: preserve
    access_time: preserve
  tags:
    - cron
    - config

- name: Ensure allowed users are present in cron.allow
  ansible.builtin.lineinfile:
    path: /etc/cron.allow
    regexp: "^{{ item | regex_escape }}$"
    line: "{{ item }}"
    create: true
    owner: root
    group: root
    mode: '0640'
  loop: "{{ cron_allowed_users | unique }}"
  loop_control:
    label: "{{ item }}"
  tags:
    - cron
    - config

- name: Gather service facts when systemd cron service management may apply
  ansible.builtin.service_facts:
  when:
    - ansible_facts['service_mgr'] == 'systemd'
    - cron_service | string | trim | length > 0
  tags:
    - cron
    - service

- name: Resolve cron service fact key
  ansible.builtin.set_fact:
    cron_service_fact_key: >-
      {{
        ([cron_service, cron_service ~ '.service']
        | select('in', ansible_facts.services.keys() | list)
        | list
        | first) | default('')
      }}
  changed_when: false
  when:
    - ansible_facts['service_mgr'] == 'systemd'
    - cron_service | string | trim | length > 0
  tags:
    - cron
    - service

- name: Enable and start cron service when discoverable
  ansible.builtin.service:
    name: "{{ cron_service_fact_key }}"
    state: started
    enabled: true
  when:
    - ansible_facts['service_mgr'] == 'systemd'
    - cron_service_fact_key | default('') | length > 0
  tags:
    - cron
    - service

- name: Manage requested cron jobs
  ansible.builtin.cron:
    name: "{{ item.name }}"
    minute: "{{ item.minute | default(omit) }}"
    hour: "{{ item.hour | default(omit) }}"
    day: "{{ item.day | default(omit) }}"
    month: "{{ item.month | default(omit) }}"
    weekday: "{{ item.weekday | default(omit) }}"
    job: "{{ item.job if (item.state | default('present')) == 'present' else omit }}"
    state: "{{ item.state | default('present') }}"
    user: "{{ item.user | default(omit) }}"
  loop: "{{ cron_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Restart cron
  when: cron_jobs | length > 0
  tags:
    - cron
    - config
